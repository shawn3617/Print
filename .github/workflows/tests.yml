# Автоматический прогон тестов при каждом пуше и pull request.
# Запуск на Windows: тестам нужны win32com/pythoncom (pywin32). AutoCAD не нужен — COM в тестах подменяется.
name: Тесты

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка синтаксиса
        run: python -m compileall -q core parsers ui main.py run_app.py

      - name: Тесты
        run: python -m unittest discover -s . -p "test_*.py" -v
